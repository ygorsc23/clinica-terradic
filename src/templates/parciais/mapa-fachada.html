<section class="mapa-fachada" data-mapa data-mapa-fonte="{{fonte}}" data-mapa-titulo="{{titulo}}">
  <h2 class="secao-titulo">Como chegar</h2>
  <p class="secao-texto">{{avisoMapa}}</p>
  <div class="mapa-moldura" data-mapa-moldura></div>
  <div class="mt-4 flex flex-wrap items-center gap-4">
    <button type="button" class="botao botao-secundario hidden" data-mapa-carregar>Carregar mapa nesta página</button>
    <a class="link" href="{{fonteLink}}" target="_blank" rel="noopener noreferrer">Abrir a localização no Google Maps<span class="sr-only"> (abre em nova aba)</span></a>
  </div>
</section>
