<details class="acordeao" id="{{ancora}}" data-acordeao>
  <summary class="acordeao-resumo" aria-controls="{{idPainel}}">
    <span>{{exame}}</span>
    <span class="acordeao-selo">{{seloRevisao}}</span>
  </summary>
  <div class="acordeao-conteudo" id="{{idPainel}}">
    {{resumo}}
    {{dados}}
    {{observacoes}}
    {{alerta}}
    {{linkServico}}
    {{avisoVariacao}}
    <p class="mt-4 text-sm"><a class="link" href="#{{ancora}}">Link direto para este preparo</a></p>
  </div>
</details>
