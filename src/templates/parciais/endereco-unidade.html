<address class="endereco" data-nap-escopo="unidade" data-nap-nome="{{nomeExibicao}}" data-nap-logradouro="{{logradouro}}" data-nap-bairro="{{bairro}}" data-nap-cep="{{cep}}" data-nap-telefone="{{telefone}}">
  <span class="block font-semibold">{{logradouro}}, {{numero}}{{complemento}}</span>
  <span class="block">{{bairro}} · CEP {{cepFormatado}}</span>
  <span class="block">{{cidade}}/{{uf}}</span>
  {{referencia}}
</address>
