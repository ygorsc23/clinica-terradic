      <p class="rodape-marca">{{marcaNome}}</p>
      <p class="mt-2 text-sm">{{razaoSocial}}</p>
      <p class="mt-1 text-sm">CNPJ {{cnpj}}</p>
      {{blocoEnderecoMatriz}}
      {{blocoContatoInstitucional}}
    </div>
    {{colunaUnidades}}
    <div class="flex flex-col gap-4">
      {{ctaExames}}
      {{blocoResponsavelTecnico}}

  <div class="rodape-base container-pagina">
    <p>© {{ano}} {{marcaNome}} · {{razaoSocial}} · CNPJ {{cnpj}}</p>
    {{linkPrivacidade}}
  </div>
</footer>
